<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ediouro</title><style>html,body{margin:0;background:#efebe2;color:#231f1a;font:14px system-ui}#s{min-height:100vh;display:grid;place-items:center;opacity:.65}</style></head><body><div id="s">Carregando Ediouro…</div><script>(async()=>{try{let h='';const base='https://raw.githubusercontent.com/thadeucupello/ediouro/8bdbc6d00024aa4b4cff88784ad4ee750192f577/preview/pcp-v2/';for(let i=0;i<24;i++){let n=String(i).padStart(2,'0');let r=await fetch(base+'c'+n+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('base '+n+' '+r.status);h+=await r.text()}const patch='https://raw.githubusercontent.com/thadeucupello/ediouro/dfeab83336b1b41965d6dd862229a26263ac5cc4/preview/structure-v2/';const menuUrl='https://raw.githubusercontent.com/thadeucupello/ediouro/40216e71242439c076413f5688983162ab2cfd4f/preview/menu-fix.js';const [cr,jr,mr]=await Promise.all([fetch(patch+'structure-v2.css',{cache:'no-store'}),fetch(patch+'structure-v2.js',{cache:'no-store'}),fetch(menuUrl,{cache:'no-store'})]);if(!cr.ok||!jr.ok||!mr.ok)throw new Error('patch '+cr.status+'/'+jr.status+'/'+mr.status);const [css,js,menu]=await Promise.all([cr.text(),jr.text(),mr.text()]);h=h.replace('</head>','<style>'+css+'</style></head>');const marker="addEventListener('hashchange',router);";if(!h.includes(marker))throw new Error('router marker não encontrado');h=h.replace(marker,js+'\n'+marker);h=h.replace('</body>','<script>'+menu+'</script></body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('s').textContent='Erro ao carregar: '+e}})()</script></body></html>
