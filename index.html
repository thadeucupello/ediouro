<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ediouro</title>
  <style>html,body{margin:0;background:#efebe2;color:#231f1a;font:14px system-ui}#s{min-height:100vh;display:grid;place-items:center;opacity:.65}</style>
</head>
<body>
<div id="s">Carregando Ediouro…</div>
<script>
(async()=>{
 const cms=new URL(location.href).searchParams.get('cms')==='1';
 try{
  const r=await fetch('/api/shell?cms='+(cms?'1':'0'),{cache:'default'});
  if(!r.ok)throw new Error('shell '+r.status);
  const h=await r.text();
  document.open();document.write(h);document.close();
 }catch(error){
  console.warn('[Ediouro] shell compilado indisponível; usando builder legado',error);
  try{
   const ref='cms-headless-v1';
   const u='https://raw.githubusercontent.com/thadeucupello/ediouro/'+ref+'/preview/runtime-builder-v1.html';
   const r=await fetch(u,{cache:'no-store'});
   if(!r.ok)throw new Error('fallback '+r.status);
   const h=await r.text();
   document.open();document.write(h);document.close();
  }catch(fallbackError){
   document.getElementById('s').textContent='Não foi possível carregar a prévia.';
   console.error(fallbackError);
  }
 }
})();
</script>
</body>
</html>
