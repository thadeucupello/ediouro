<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ediouro</title>
  <style>
    html,body{margin:0;background:#efebe2;color:#231f1a;font:14px system-ui}
    #status{min-height:100vh;display:grid;place-items:center;opacity:.65;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div id="status">Carregando Ediouro…</div>
  <script>
    const STATIC_BASE = 'https://raw.githubusercontent.com/thadeucupello/ediouro/codex/supabase-catalog/preview/pcp-v2/'
    const SUPABASE_URL = 'https://wubthvvtncflzkblgtzh.supabase.co'
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8kcCqGxfrFkWMuk9Oy8kaQ_2Axv3GuQ'

    const mapWork = row => ({
      id: row.id,
      slug: row.slug,
      title: row.title,
      subtitle: row.subtitle,
      shortDescription: row.short_description,
      description: row.description || [],
      imprint: row.imprint,
      collections: row.collections || [],
      categories: row.categories || [],
      subjects: row.subjects || [],
      featured: row.featured || [],
      popularity: row.popularity || 0,
      seoTitle: row.seo_title,
      seoDescription: row.seo_description,
      series: row.series_slug,
      seriesOrder: row.series_order,
      credits: row.credits || []
    })

    const mapEdition = row => ({
      id: row.id,
      workSlug: row.work_slug,
      label: row.label,
      format: row.format,
      publicationDate: row.publication_date || '',
      language: row.language,
      status: row.status,
      binding: row.binding,
      isbn: row.isbn,
      ean: row.ean,
      pageCount: row.page_count,
      dimensions: row.dimensions,
      cover: row.cover_url || row.cover_source_url || '',
      gallery: row.gallery || [],
      price: row.price == null ? null : Number(row.price),
      currency: row.currency || 'BRL',
      credits: row.credits || [],
      displayPriority: row.display_priority || 0,
      retailerLinks: row.retailer_links || [],
      availabilityNote: row.availability_note
    })

    const mapContributor = row => ({
      slug: row.slug,
      name: row.name,
      roles: row.roles || [],
      shortBio: row.short_bio,
      bio: row.bio || [],
      imprints: row.metadata?.imprints || []
    })

    const mapSeries = row => ({
      slug: row.slug,
      name: row.name,
      description: row.description,
      imprint: row.imprint,
      mainContributor: row.main_contributor,
      workSlugs: row.work_slugs || []
    })

    async function fetchTable(table, order) {
      const query = new URLSearchParams({ select: '*', limit: '1000' })
      if (order) query.set('order', order)
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
        headers: { apikey: SUPABASE_PUBLISHABLE_KEY },
        cache: 'no-store'
      })
      if (!response.ok) throw new Error(`${table}: ${response.status}`)
      return response.json()
    }

    async function fetchCatalog() {
      const [works, editions, contributors, series] = await Promise.all([
        fetchTable('catalog_works', 'title.asc'),
        fetchTable('catalog_editions', 'display_priority.desc'),
        fetchTable('catalog_contributors', 'name.asc'),
        fetchTable('catalog_series', 'name.asc')
      ])
      if (works.length !== 85 || editions.length !== 101) {
        throw new Error(`catálogo incompleto: ${works.length} obras / ${editions.length} edições`)
      }
      return {
        works: works.map(mapWork),
        editions: editions.map(mapEdition),
        contributors: contributors.map(mapContributor),
        series: series.map(mapSeries)
      }
    }

    async function fetchLayout() {
      let html = ''
      for (let index = 0; index < 24; index += 1) {
        const part = String(index).padStart(2, '0')
        const response = await fetch(`${STATIC_BASE}c${part}.txt`, { cache: 'no-store' })
        if (!response.ok) throw new Error(`layout c${part}: ${response.status}`)
        html += await response.text()
      }
      return html
    }

    ;(async () => {
      try {
        const [catalog, layout] = await Promise.all([fetchCatalog(), fetchLayout()])
        const serialized = JSON.stringify(catalog).replaceAll('<', '\\u003c')
        const marker = 'const IMPRINTS='
        if (!layout.includes(marker)) throw new Error('marcador do catálogo não encontrado')
        const html = layout.replace(marker, `window.DATA=${serialized};${marker}`)
        document.open()
        document.write(html)
        document.close()
      } catch (error) {
        document.getElementById('status').textContent = `Erro ao carregar o catálogo: ${error.message}`
        console.error('[ediouro-catalog]', error)
      }
    })()
  </script>
</body>
</html>
