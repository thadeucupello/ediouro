<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ediouro</title>
  <style>html,body{margin:0;background:#efebe2;color:#231f1a;font:14px system-ui}#s{min-height:100vh;display:grid;place-items:center;opacity:.65}</style>
</head>
<body>
<div id="s">Carregando Ediouro…</div>
<script>
(async()=>{
 try{
  const source='https://raw.githubusercontent.com/thadeucupello/ediouro/79160aa2cb932ff2fcc7d956e6175d57f7ecf4b7/index.html';
  const oldCover='https://raw.githubusercontent.com/thadeucupello/ediouro/d4c17f80a03c268f4337f6d5930d9ab92f5f8539/preview/covers-v2.js';
  const newCover='https://raw.githubusercontent.com/thadeucupello/ediouro/75899b074c2f6823d0b456e1000dd9c58551a364/preview/covers-v2.js';
  const oldCatalogCss='https://raw.githubusercontent.com/thadeucupello/ediouro/3477e2abbe9049a3385eb419a368862374341def/preview/catalog-v3.css';
  const newCatalogCss='https://raw.githubusercontent.com/thadeucupello/ediouro/ae5b715d534c6998569fde691ec7b1e1480e4d89/preview/catalog-v3.css';
  const r=await fetch(source,{cache:'no-store'});
  if(!r.ok)throw new Error('base '+r.status);
  let h=await r.text();
  h=h.replace(oldCover,newCover).replace(oldCatalogCss,newCatalogCss);
  document.open();document.write(h);document.close();
 }catch(e){
  document.getElementById('s').textContent='Não foi possível carregar a prévia. '+e.message;
 }
})();
</script>
