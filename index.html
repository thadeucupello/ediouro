e{padding:55px 0}.page h1{font-size:65px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 18px}.detail{display:grid;grid-template-columns:330px 1fr;gap:45px}.detail img{width:100%}.detail h1{font-size:56px}@media(max-width:800px){.nav{display:none}.hero{grid-template-columns:1fr;gap:18px;min-height:0;padding:38px 0 42px}.hero h1{font-size:58px}.lead{font-size:15px}.stage{height:340px;margin-inline:-16px;overflow:hidden}.stage:before{inset:38px 26px 20px 35px}.stage:after{inset:56px 42px 11px 15px}.hb.c{height:285px;bottom:30px}.hb.l{height:205px;left:-1%;bottom:42px}.hb.r{height:210px;right:-3%;bottom:28px}.cap{right:16px;width:130px;font-size:8px}.cap b{font-size:15px}section{padding:52px 0}.sh{display:block}.cat{grid-template-columns:35px 1fr auto}.cat strong{font-size:30px}.cat span{display:none}.shelf{display:flex;overflow-x:auto;gap:16px}.book{min-width:43vw}.cf{height:235px}.fg,.hist,.ng,.detail{grid-template-columns:1fr}.feature h2{font-size:54px}.fbooks img{height:215px}.fbooks img:nth-child(2){height:245px}.sps{height:290px;overflow-x:auto;padding-right:30px}.sp{min-width:64px;width:64px}.sp span{font-size:20px}.sp1{height:225px}.sp2{height:278px}.sp3{height:210px}.sp4{height:255px}.sp5{height:195px}.sp6{height:238px}.sp7{height:268px}.tri,.dg{grid-template-columns:1fr}.tc,.story,.story:last-child{border-right:0;border-bottom:1px solid var(--l);padding:20px 0;min-height:220px}.story h3{font-size:38px}.year{font-size:125px}.hist h2,.news h2{font-size:45px}.foot{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="app"></div><script>const B=[['sombra','A sombra dos deuses','John Gwynne','trama','fantasia','https://cdn.awsli.com.br/2444/2444709/produto/372477285/mockup_a-sombra-dos-deuses_capa-frente-1azg57cmfm.png'],['honjin','Os assassinatos no Honjin','Seishi Yokomizo','trama','crime','https://cdn.awsli.com.br/2444/2444709/produto/403115194/c54d28b1634647aaa4a971f16a44790e-45ebyi6cfq.png'],['outra-vida','Eu te amei em outra vida','David Arnold','alice','romance','https://cdn.awsli.com.br/2444/2444709/produto/251633405/eu-te-amei-em-outra-vida_capa-e-quarta-capa_fundo-rdw9f32wd5.jpg'],['caminho','O Caminho dos Reis','Brandon Sanderson','trama','fantasia','https://cdn.awsli.com.br/2444/2444709/produto/169742790/9d80a091b8.jpg'],['mistborn','Mistborn: O império final','Brandon Sanderson','trama','fantasia','https://cdn.awsli.com.br/2444/2444709/produto/349632993/mockup_mistborn_capa-frente-8hdeaoza1v.png'],['warbreaker','Warbreaker: o sopro dos Deuses','Brandon Sanderson','trama','fantasia','https://cdn.awsli.com.br/2444/2444709/produto/310018573/warbreaker_capa-8tihmcawes.png'],['zodiaco','A ascensão do zodíaco','Katie Zhao','alice','fantasia','https://cdn.awsli.com.br/2444/2444709/produto/400586163/acc78367f5564f019826cc2be7932d1b-n5de2iqe4y.jpg'],['sonhos','A casa dos sonhos','Claire Douglas','trama','crime','https://cdn.awsli.com.br/2444/2444709/produto/281986973/a-casa-dos-sonhos-mockup-capa-2xnrtc372z.png']].map(x=>({slug:x[0],title:x[1],author:x[2],imprint:x[3],cat:x[4],cover:x[5]})),M=Object.fromEntries(B.map(x=>[x.slug,x])),go=p=>location.hash=p,path=()=>location.hash.slice(1)||'/';const hd=()=>`<header><div class="w hd"><div class="logo" onclick="go('/')">ediouro.</div><div class="nav"><a href="#/livros">Livros</a><a href="#/autores">Autores</a><a href="#/series">Séries</a><a href="#/marcas">Marcas</a><a href="#/descubra">Descubra</a></div><a href="#/livros">Buscar</a></div></header>`,ft=()=>`<footer><div class="w foot"><div><div class="logo">ediouro.</div><p>Livros, autores, séries e marcas em um só lugar.</p></div><div><b>Descubra</b><a href="#/livros">Livros</a><a href="#/autores">Autores</a></div><div><b>Marcas</b><a href="#/marcas">Todas as casas</a><a href="#/marca/trama">Trama</a></div><div><b>Ediouro</b><a href="#/sobre">Sobre</a><a href="#/sobre">História</a></div></div></footer>`;function bc(b){return `<div class="book" onclick="go('/livro/${b.slug}')"><div class="cf"><img src="${b.cover}"></div><h3>${b.title}</h3><div class="by">${b.author} · ${b.imprint==='trama'?'TRAMA':'LIVROS DA ALICE'}</div></div>`}function shelf(a){return `<div class="shelf">${a.map(s=>bc(M[s])).join('')}</div>`}function home(){return `${hd()}<main><div class="w hero"><div><div class="ey">Encontre sua próxima leitura</div><h1>Todo mundo tem um livro esperando.</h1><p class="lead">Histórias, autores e universos publicados pelas marcas do Grupo Ediouro.</p><div class="search"><input id="q" placeholder="Título, autor, série ou ISBN"><button onclick="search()">Buscar</button></div><div class="meta"><span>Desde 1939</span><span>7 casas editoriais</span><span>Catálogo em integração</span></div></div><div class="stage"><img class="hb l" src="${M.honjin.cover}" onclick="go('/livro/honjin')"><img class="hb c" src="${M.sombra.cover}" onclick="go('/livro/sombra')"><img class="hb r" src="${M['outra-vida'].cover}" onclick="go('/livro/outra-vida')"><div class="cap"><div class="ey">Em destaque</div><b>A sombra dos deuses</b>John Gwynne · Trama</div></div></div><section class="discover"><div class="w"><div class="sh"><div><div class="ey">Descoberta</div><h2>O que você quer ler?</h2></div><p>Comece pelo sentimento, pelo gênero ou por uma obsessão. O catálogo faz o resto.</p></div><div class="cats"><div class="cat" onclick="go('/livros?c=fantasia')"><small>01</small><strong>Fantasia</strong><span>Mundos inteiros, magia e sagas para desaparecer por algumas horas.</span><span class="catlink">Explorar</span></div><div class="cat" onclick="go('/livros?c=crime')"><small>02</small><strong>Crime e mistério</strong><span>Casos impossíveis, pistas escondidas e suspeitos demais.</span><span class="catlink">Explorar</span></div><div class="cat" onclick="go('/livros?c=romance')"><small>03</small><strong>Romance</strong><span>Encontros, desencontros e histórias que insistem em permanecer.</span><span class="catlink">Explorar</span></div></div></div></section><section><div class="w"><div class="sh"><div><div class="ey">Novidades</div><h2>Acabaram de chegar</h2></div><a href="#/livros">Ver catálogo completo</a></div>${shelf(['zodiaco','honjin','outra-vida','sombra','sonhos','mistborn'])}</div></section><section class="feature"><div class="w fg"><div><div class="ey" style="color:#b9c7c1">Comece por aqui</div><h2>Quer entrar no Cosmere?</h2><p>Não precisa decorar planetas, ordens ou sistemas de magia. A gente organiza os caminhos para você começar pelo livro certo.</p><a href="#/autor/brandon-sanderson">Explorar guia de leitura</a></div><div class="fbooks">${['mistborn','warbreaker','caminho'].map(s=>`<img src="${M[s].cover}">`).join('')}</div></div></section><section><div class="w"><div class="sh"><div><div class="ey">Curadoria Ediouro</div><h2>Escolha por onde começar</h2></div><p>Gêneros, autores e portas de entrada para o catálogo.</p></div>${shelf(['caminho','sombra','zodiaco','mistborn','warbreaker','honjin'])}</div></section><section class="brands"><div class="w"><div class="sh"><div><div class="ey">Nossas casas editoriais</div><h2>Muitas vozes.<br>Muitos leitores.<br>Uma Ediouro.</h2></div><p>Cada marca ocupa uma prateleira própria, com identidade, catálogo e comunidade.</p></div><div class="sps"><div class="sp sp1"><span>Nova Fronteira</span></div><div class="sp sp2"><span>Trama</span></div><div class="sp sp3"><span>Agir</span></div><div class="sp sp4"><span>Petra</span></div><div class="sp sp5"><span>Coquetel</span></div><div class="sp sp6"><span>Pixel</span></div><div class="sp sp7"><span>Livros da Alice</span></div></div></div></section><section><div class="w tri"><div class="tc"><div class="ey">Vem aí</div><h3>Próximas histórias</h3><p>Pré-vendas, novos volumes e livros prestes a chegar.</p></div><div class="tc"><div class="ey">Série em destaque</div><h3>O Arquivo das Tempestades</h3><p>Roshar, ordens de leitura e os caminhos de uma grande saga.</p></div><div class="tc"><div class="ey">Autores</div><h3>Quem escreve nossas histórias</h3><p>Sanderson, Gwynne, Yokomizo, Arnold e muitos outros.</p></div></div></section><section class="desc"><div class="w"><div class="sh"><div><div class="ey">Descubra</div><h2>Um livro leva a outro.</h2></div></div><div class="dg"><div class="story"><div class="ey">Guia de leitura · 01</div><h3>Por onde começar a ler Brandon Sanderson?</h3></div><div class="story"><div class="ey">Curadoria · 02</div><h3>Crime e mistério para montar o quebra-cabeça.</h3></div></div></div></section><section class="history"><div class="w hist"><div class="year">1939</div><div><div class="ey">Grupo Ediouro</div><h2>Há mais de oito décadas, ajudamos histórias a encontrar leitores.</h2><p>De clássicos a novos universos, de passatempos a grandes narrativas.</p></div></div></section><section class="news"><div class="w ng"><div><div class="ey" style="color:#b9c7c1">Continue por perto</div><h2>Quer um livro novo na sua vida?</h2></div><div class="search"><input placeholder="seu@email.com"><button>Quero receber</button></div></div></section></main>${ft()}`}function search(){let q=(document.getElementById('q')?.value||'').toLowerCase(),b=B.find(x=>(x.title+' '+x.author).toLowerCase().includes(q));go(b?'/livro/'+b.slug:'/livros')}function catalog(q=''){let c=new URLSearchParams(q).get('c')||'',a=B.filter(b=>!c||b.cat===c);return `${hd()}<main class="w page"><div class="ey">Catálogo</div><h1>Livros</h1><div class="grid">${a.map(bc).join('')}</div></main>${ft()}`}function book(s){let b=M[s];return b?`${hd()}<main class="w page detail"><div><img src="${b.cover}"></div><div><div class="ey">${b.imprint==='trama'?'Trama':'Livros da Alice'}</div><h1>${b.title}</h1><h3>${b.author}</h3><p class="lead">Página editorial em construção com sinopse, edições, série, autor e onde comprar.</p></div></main>${ft()}`:simple('Página não encontrada')}function simple(t){return `${hd()}<main class="w page"><h1>${t}</h1>${shelf(['sombra','honjin','outra-vida','caminho','mistborn','warbreaker'])}</main>${ft()}`}function render(){let [p,q='']=(path()).split('?'),x=p.split('/').filter(Boolean),o=p==='/'?home():x[0]==='livros'?catalog(q):x[0]==='livro'?book(x[1]):simple(x[0]?.replaceAll('-',' ')||'Ediouro');document.getElementById('app').innerHTML=o;scrollTo(0,0)}addEventListener('hashchange',render);render();</script></body></html>
