<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ediouro — Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#12221d;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:5;background:rgba(244,240,232,.96);border-bottom:1px solid #d8d0c1;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font:700 24px Georgia}.nav{display:flex;gap:20px;font-size:14px}.hero{padding:54px 20px 30px;max-width:1180px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:center}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase}.hero h1{font:500 clamp(44px,7vw,92px)/.95 Georgia;margin:12px 0 18px;letter-spacing:-.04em}.hero p{max-width:580px;color:#4d5a55;font-size:17px;line-height:1.5}.search{display:flex;background:white;border:1px solid #cabfae;margin-top:24px}.search input{border:0;outline:0;padding:16px;flex:1;font-size:16px}.search button,.btn{border:0;background:#123a2d;color:white;padding:15px 18px;cursor:pointer}.covers{display:flex;justify-content:center;align-items:end;gap:14px}.covers img{width:31%;max-width:180px;box-shadow:0 16px 30px #0003}.covers img:nth-child(2){transform:translateY(-20px)}section{max-width:1180px;margin:auto;padding:44px 20px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.section-head h2{font:500 38px Georgia;margin:0}.muted{color:#69736f;font-size:14px}.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}.book{cursor:pointer}.book img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#ddd;box-shadow:0 8px 18px #0002}.book h3{font:500 17px Georgia;margin:10px 0 4px}.book small{color:#5d6762}.feature{max-width:none;background:#152d27;color:white}.feature .inner{max-width:1180px;margin:auto;padding:54px 20px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.feature h2{font:500 52px Georgia;margin:8px 0}.feature p{color:#d6dfda;line-height:1.6}.catalog{display:grid;grid-template-columns:220px 1fr;gap:34px}.filters{border-right:1px solid #d6cdbd;padding-right:18px}.filters button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.detail{max-width:1050px;margin:auto;padding:44px 20px;display:grid;grid-template-columns:360px 1fr;gap:48px}.detail img{width:100%;box-shadow:0 15px 35px #0003}.detail h1{font:500 50px/1 Georgia;margin:8px 0}.price{font:600 22px Arial}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;border-top:1px solid #d4cabc;margin-top:24px;padding-top:18px}.back{font-size:14px;text-decoration:underline;cursor:pointer}.where{margin-top:24px;padding-top:18px;border-top:1px solid #d4cabc}.retailers{display:flex;gap:10px;flex-wrap:wrap}.retailers a{border:1px solid #123a2d;padding:12px 14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border-top:1px solid #cfc5b6;padding-top:14px;cursor:pointer}.card h3{font:500 24px Georgia;margin:5px 0}.brand-band{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.brand{background:#17372e;color:white;padding:25px;min-height:140px;display:flex;align-items:flex-end;font:500 25px Georgia;cursor:pointer}.brand:nth-child(2){background:#5b2032}.brand:nth-child(3){background:#8b6b2e}.brand:nth-child(4){background:#31405d}footer{margin-top:40px;background:#10271f;color:#d8e0dc;padding:36px 20px;text-align:center}@media(max-width:800px){.nav{display:none}.hero{grid-template-columns:1fr;padding-top:34px}.hero h1{font-size:54px}.covers{margin-top:10px}.shelf{display:flex;overflow-x:auto;gap:16px}.book{min-width:42vw}.feature .inner{grid-template-columns:1fr}.feature h2{font-size:40px}.catalog{grid-template-columns:1fr}.filters{border-right:0;border-bottom:1px solid #d6cdbd;padding-bottom:12px}.filters button{display:inline-block;width:auto;margin-right:15px}.grid{grid-template-columns:repeat(2,1fr);gap:16px}.detail{grid-template-columns:1fr;padding-top:28px}.detail>div:first-child{max-width:280px;margin:auto}.detail h1{font-size:42px}.cards{grid-template-columns:1fr}.brand-band{grid-template-columns:1fr 1fr}.search{position:relative}.search input{min-width:0}}</style></head><body><div id="app"></div><script>const books=[{"slug":"o-caminho-dos-reis","title":"O Caminho dos Reis","author":"Brandon Sanderson","imprint":"trama","category":"fantasia","series":"arquivo-das-tempestades","desc":"Do autor best-seller n.º 1 do New York Times, O caminho dos reis chega ao Brasil iniciando uma saga épica em Roshar.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/169742790/9d80a091b8.jpg","price":199.9,"isbn":"9786589132684","format":"Brochura"},{"slug":"os-assassinatos-no-honjin","title":"Os assassinatos no Honjin","author":"Seishi Yokomizo","imprint":"trama","category":"crime-e-misterio","series":"","desc":"No inverno de 1937, um misterioso assassinato abala a vila de Okamura na noite de um casamento.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/403115194/c54d28b1634647aaa4a971f16a44790e-45ebyi6cfq.png","price":69.9,"isbn":"9786581339616","format":"Brochura"},{"slug":"eu-te-amei-em-outra-vida","title":"Eu te amei em outra vida","author":"David Arnold","imprint":"livros-da-alice","category":"romance","series":"","desc":"Uma sensível história de amor sobre dois jovens e suas almas que insistem em se encontrar a cada nova vida.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/251633405/eu-te-amei-em-outra-vida_capa-e-quarta-capa_fundo-rdw9f32wd5.jpg","price":54.9,"isbn":"9786585659048","format":"Brochura"},{"slug":"a-sombra-dos-deuses","title":"A sombra dos deuses","author":"John Gwynne","imprint":"trama","category":"fantasia","series":"bloodsworn","desc":"A sombra dos deuses abre a Saga Bloodsworn: fantasia épica inspirada na mitologia nórdica.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/372477285/mockup_a-sombra-dos-deuses_capa-frente-1azg57cmfm.png","price":99.9,"isbn":"9786581339333","format":"Brochura"},{"slug":"mistborn-o-imperio-final","title":"Mistborn: O império final","author":"Brandon Sanderson","imprint":"trama","category":"fantasia","series":"mistborn","desc":"As brumas dominam a noite. O Senhor Soberano domina o mundo. Uma nova revolta começa a se formar.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/349632993/mockup_mistborn_capa-frente-8hdeaoza1v.png","price":104.9,"isbn":"9786581339180","format":"Brochura"},{"slug":"warbreaker-o-sopro-dos-deuses","title":"Warbreaker: o sopro dos Deuses","author":"Brandon Sanderson","imprint":"trama","category":"fantasia","series":"","desc":"Um livro independente situado no Cosmere, com princesas, deuses e uma magia movida por cores e Respiração.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/310018573/warbreaker_capa-8tihmcawes.png","price":169.9,"isbn":"9786581339067","format":"Brochura"},{"slug":"a-ascensao-do-zodiaco","title":"A ascensão do zodíaco","author":"Katie Zhao","imprint":"livros-da-alice","category":"fantasia","series":"","desc":"Na Academia dos Ramos Terrenos, herdeiros das linhagens do zodíaco chinês dominam habilidades extraordinárias.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/400586163/acc78367f5564f019826cc2be7932d1b-n5de2iqe4y.jpg","price":79.9,"isbn":"9786585659451","format":"Brochura"},{"slug":"a-casa-dos-sonhos","title":"A casa dos sonhos","author":"Claire Douglas","imprint":"trama","category":"crime-e-misterio","series":"","desc":"Um casal herda a casa dos sonhos, mas esqueletos enterrados no jardim revelam segredos sombrios.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/281986973/a-casa-dos-sonhos-mockup-capa-2xnrtc372z.png","price":69.9,"isbn":"9786589132912","format":"Brochura"},{"slug":"a-casa-marionne","title":"A casa Marionne","author":"J. Elle","imprint":"livros-da-alice","category":"fantasia","series":"","desc":"Quell Marionne esconde uma magia perigosa enquanto entra numa sociedade de elites mágicas.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/270482719/a-casa-marionne-mockup--capa-vtr1lsc6nv.png","price":69.9,"isbn":"9786585659055","format":"Brochura"},{"slug":"a-causa-da-morte","title":"A Causa da Morte","author":"Kate London","imprint":"trama","category":"crime-e-misterio","series":"","desc":"Um experiente policial e uma adolescente despencam para a morte do alto de um prédio em Londres.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/176393042/e3fa66ec93.jpg","price":44.9,"isbn":"9786589132691","format":"Brochura"}];const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const money=v=>v?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v):'';const route=p=>{location.hash=p};const current=()=>location.hash.slice(1)||'/';function header(){return `<header><div class="logo" onclick="route('/')">ediouro</div><nav class="nav"><a href="#/livros">Livros</a><a href="#/autores">Autores</a><a href="#/series">Séries</a><a href="#/marcas">Marcas</a><a href="#/descubra">Descubra</a></nav><a href="#/livros">Buscar</a></header>`}function bcard(b){return `<article class="book" onclick="route('/livro/${b.slug}')"><img src="${esc(b.cover)}" alt="Capa de ${esc(b.title)}"><h3>${esc(b.title)}</h3><small>${esc(b.author)} · ${b.imprint==='trama'?'TRAMA':'LIVROS DA ALICE'}</small></article>`}function home(){let hero=books.slice(0,3);return `${header()}<main><div class="hero"><div><div class="eyebrow">Encontre sua próxima leitura</div><h1>Todo mundo tem um livro esperando.</h1><p>Histórias, autores e universos publicados pelas marcas do Grupo Ediouro.</p><div class="search"><input id="q" placeholder="Busque por título, autor, série ou ISBN"><button onclick="searchNow()">Buscar</button></div><p class="muted">Desde 1939 · Livros mudam tudo.</p></div><div class="covers">${hero.map(b=>`<img onclick="route('/livro/${b.slug}')" src="${esc(b.cover)}">`).join('')}</div></div><section><div class="section-head"><div><div class="eyebrow">Catálogo real</div><h2>Descubra novos livros</h2></div><a href="#/livros">Ver todos →</a></div><div class="shelf">${books.slice(0,6).map(bcard).join('')}</div></section><div class="feature"><div class="inner"><div><div class="eyebrow">Comece por aqui</div><h2>Quer entrar no Cosmere?</h2><p>Mistborn, Warbreaker e O Arquivo das Tempestades. Um caminho simples para descobrir os mundos de Brandon Sanderson.</p><button class="btn" onclick="route('/autor/brandon-sanderson')">Descubra Brandon Sanderson →</button></div><div class="covers">${books.filter(b=>b.author.includes('Sanderson')).slice(0,3).map(b=>`<img onclick="route('/livro/${b.slug}')" src="${esc(b.cover)}">`).join('')}</div></div></div><section><div class="section-head"><h2>Nossas casas editoriais</h2></div><div class="brand-band"><div class="brand" onclick="route('/marca/trama')">Trama</div><div class="brand" onclick="route('/marca/livros-da-alice')">Livros da Alice</div><div class="brand" onclick="route('/marcas')">Nova Fronteira</div><div class="brand" onclick="route('/marcas')">Coquetel + outras</div></div></section></main>${footer()}`}function catalog(){return `${header()}<main><section><div class="section-head"><div><div class="eyebrow">Catálogo</div><h2>Livros</h2><div class="muted">Amostra real da Trama e Livros da Alice</div></div></div><div class="catalog"><aside class="filters"><b>Filtrar</b><button onclick="filterCat('')">Todos</button><button onclick="filterCat('fantasia')">Fantasia</button><button onclick="filterCat('crime-e-misterio')">Crime e mistério</button><button onclick="filterCat('trama')">Trama</button><button onclick="filterCat('livros-da-alice')">Livros da Alice</button></aside><div id="bookgrid" class="grid">${books.map(bcard).join('')}</div></div></section></main>${footer()}`}function book(slug){let b=books.find(x=>x.slug===slug);if(!b)return notfound();return `${header()}<main><div class="detail"><div><img src="${esc(b.cover)}" alt="${esc(b.title)}"></div><div><span class="back" onclick="history.back()">← voltar</span><div class="eyebrow">${b.imprint==='trama'?'TRAMA':'LIVROS DA ALICE'}</div><h1>${esc(b.title)}</h1><h3 onclick="route('/autor/${slugify(b.author)}')" style="cursor:pointer">${esc(b.author)}</h3><p>${esc(b.desc)}</p><div class="price">${money(b.price)}</div><div class="where"><b>Onde comprar</b><div class="retailers"><a target="_blank" href="https://www.amazon.com.br/s?k=${encodeURIComponent(b.isbn||b.title)}">Amazon</a><a target="_blank" href="https://lista.mercadolivre.com.br/${encodeURIComponent(b.isbn||b.title)}">Mercado Livre</a></div></div><div class="meta"><div><b>ISBN</b><br>${esc(b.isbn)}</div><div><b>Formato</b><br>${esc(b.format)}</div><div><b>Categoria</b><br>${esc(b.category)}</div><div><b>Série</b><br>${esc(b.series||'—')}</div></div></div></div></main>${footer()}`}const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');function authors(){let a=[...new Set(books.map(b=>b.author))];return `${header()}<main><section><div class="eyebrow">Autores</div><div class="section-head"><h2>Quem escreve nossas histórias</h2></div><div class="cards">${a.map(n=>`<div class="card" onclick="route('/autor/${slugify(n)}')"><h3>${esc(n)}</h3><span>${books.filter(b=>b.author===n).length} livro(s) nesta preview →</span></div>`).join('')}</div></section></main>${footer()}`}function author(slug){let list=books.filter(b=>slugify(b.author)===slug),name=list[0]?.author||'Autor';return `${header()}<main><section><div class="eyebrow">Autor</div><div class="section-head"><h2>${esc(name)}</h2></div><div class="grid">${list.map(bcard).join('')}</div></section></main>${footer()}`}function series(){let ss=[...new Set(books.map(b=>b.series).filter(Boolean))];return `${header()}<main><section><div class="eyebrow">Séries e universos</div><div class="section-head"><h2>Histórias que continuam</h2></div><div class="cards">${ss.length?ss.map(s=>`<div class="card" onclick="route('/serie/${s}')"><h3>${esc(s.replace(/-/g,' '))}</h3><span>Ver ordem de leitura →</span></div>`).join(''):'<p>Mais séries entram conforme enriquecemos o catálogo.</p>'}</div></section></main>${footer()}`}function serie(slug){let list=books.filter(b=>b.series===slug);return `${header()}<main><section><div class="eyebrow">Série</div><div class="section-head"><h2>${esc(slug.replace(/-/g,' '))}</h2></div><div class="grid">${list.map(bcard).join('')}</div></section></main>${footer()}`}function marcas(){return `${header()}<main><section><div class="eyebrow">Grupo Ediouro</div><div class="section-head"><h2>Muitas vozes. Muitos leitores. Uma Ediouro.</h2></div><div class="brand-band"><div class="brand" onclick="route('/marca/trama')">Trama</div><div class="brand" onclick="route('/marca/livros-da-alice')">Livros da Alice</div><div class="brand">Nova Fronteira</div><div class="brand">Coquetel</div></div><p class="muted">Nesta primeira carga navegável, o catálogo real integrado é Trama + Livros da Alice.</p></section></main>${footer()}`}function marca(slug){let list=books.filter(b=>b.imprint===slug),name=slug==='trama'?'Trama':'Livros da Alice';return `${header()}<main><section><div class="eyebrow">Casa editorial</div><div class="section-head"><h2>${name}</h2></div><div class="grid">${list.map(bcard).join('')}</div></section></main>${footer()}`}function descubra(){return `${header()}<main><section><div class="eyebrow">Descubra</div><div class="section-head"><h2>Um livro leva a outro.</h2></div><div class="cards"><div class="card" onclick="route('/autor/brandon-sanderson')"><h3>Por onde começar a ler Brandon Sanderson?</h3><span>Guia de leitura →</span></div><div class="card" onclick="route('/livros')"><h3>Fantasia, crime ou romance?</h3><span>Explore o catálogo →</span></div><div class="card" onclick="route('/marcas')"><h3>Conheça nossas casas editoriais</h3><span>Ver marcas →</span></div></div></section></main>${footer()}`}function footer(){return `<footer>Grupo Ediouro · Preview navegável · catálogo real parcial</footer>`}function notfound(){return `${header()}<section><h2>Página não encontrada</h2><a href="#/">Voltar à home</a></section>`}function filterCat(v){document.getElementById('bookgrid').innerHTML=books.filter(b=>!v||b.category===v||b.imprint===v).map(bcard).join('')}function searchNow(){let q=(document.getElementById('q')?.value||'').toLowerCase();let b=books.find(x=>(x.title+' '+x.author+' '+x.isbn+' '+x.series).toLowerCase().includes(q));if(b)route('/livro/'+b.slug);else route('/livros')}function render(){let p=current(),parts=p.split('/').filter(Boolean);let out=p==='/'?home():parts[0]==='livros'?catalog():parts[0]==='livro'?book(parts[1]):parts[0]==='autores'?authors():parts[0]==='autor'?author(parts[1]):parts[0]==='series'?series():parts[0]==='serie'?serie(parts[1]):parts[0]==='marcas'?marcas():parts[0]==='marca'?marca(parts[1]):parts[0]==='descubra'?descubra():notfound();document.getElementById('app').innerHTML=out;scrollTo(0,0)}window.addEventListener('hashchange',render);render();</script></body></html>
