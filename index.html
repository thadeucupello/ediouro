<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ediouro</title>
  <style>html,body{margin:0;background:#efebe2;color:#231f1a;font:14px system-ui}#s{min-height:100vh;display:grid;place-items:center;opacity:.65}</style>
</head>
<body>
<div id="s">Carregando Ediouro…</div>
<script>
(async()=>{
 try{
  const base='https://raw.githubusercontent.com/thadeucupello/ediouro/8bdbc6d00024aa4b4cff88784ad4ee750192f577/preview/pcp-v2/';
  const jobs=Array.from({length:24},async(_,i)=>{
   const n=String(i).padStart(2,'0');
   const r=await fetch(base+'c'+n+'.txt',{cache:'force-cache'});
   if(!r.ok)throw new Error('parte '+n+' '+r.status);
   return r.text();
  });
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('tempo de carregamento excedido')),15000));
  const parts=await Promise.race([Promise.all(jobs),timeout]);
  let h=parts.join('');
  const marker="addEventListener('hashchange',router);";
  const assets=[
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/1a7a31c5c5508835cd989ea1395324d01256f363/preview/catalog-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/1a7a31c5c5508835cd989ea1395324d01256f363/preview/catalog-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/91e0c50cf77e3fd025419ae14efed195ac4a0cd5/preview/series-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/91e0c50cf77e3fd025419ae14efed195ac4a0cd5/preview/series-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/f2129d89a62bd03334b7eeead2dccd382c3c843a/preview/authors-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/f2129d89a62bd03334b7eeead2dccd382c3c843a/preview/authors-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/1cfdff10108f7703deddcf4b29eb5e6c422e11e5/preview/book-entity-links-v1.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/1cfdff10108f7703deddcf4b29eb5e6c422e11e5/preview/book-entity-links-v1.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/b142f1f20c5d3157c430c7e156d9c9dfbac74ccc/preview/brands-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/b142f1f20c5d3157c430c7e156d9c9dfbac74ccc/preview/brands-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/92b46db4b640367e7943e144f7b71d0c3ad289e8/preview/brand-palette-v1.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/92b46db4b640367e7943e144f7b71d0c3ad289e8/preview/brand-palette-v1.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/f8940d444f7a66c48ad80df713c23dcb1f458f72/preview/discover-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/f8940d444f7a66c48ad80df713c23dcb1f458f72/preview/discover-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/8b368ff9a3f559da3c66fd528635805590a10b80/preview/about-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/8b368ff9a3f559da3c66fd528635805590a10b80/preview/about-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/4c478a8e116ab57fbf349415bc9c83aa61c01279/preview/support-v3.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/4c478a8e116ab57fbf349415bc9c83aa61c01279/preview/support-v3.js'],
   ['css','https://raw.githubusercontent.com/thadeucupello/ediouro/1f2dbda3d5d41ad8d6935b0edd376612039e5424/preview/site-enhancements-v1.css'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/1f2dbda3d5d41ad8d6935b0edd376612039e5424/preview/site-enhancements-v1.js'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/551a47f1b93d91a602d61dc57c80447b96ab5c8e/preview/support-pages-v2.js'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/d66c69d40a607b381511606504d7519c2c697d80/preview/support-distribution-v1.js'],
   ['js','https://raw.githubusercontent.com/thadeucupello/ediouro/a8237fd54d57602eaf0caeb1c771b1a5746216a0/preview/home-interest-nav-v1.js']
  ];
  const loaded=await Promise.all(assets.map(async([kind,url])=>{
   try{const r=await fetch(url,{cache:'force-cache'});return r.ok?[kind,await r.text()]:null}catch(_){return null}
  }));
  for(const item of loaded){
   if(!item)continue;
   const [kind,text]=item;
   if(kind==='css')h=h.replace('</head>','<style>'+text+'</style></head>');
   else if(h.includes(marker))h=h.replace(marker,text+'\n'+marker);
  }
  const menuCss=`@media(max-width:760px){.mobile-menu{display:block!important;position:fixed!important;inset:0!important;width:100%!important;height:100vh!important;height:100dvh!important;z-index:10000!important;visibility:hidden!important;pointer-events:none!important;transform:translate3d(-100%,0,0)!important;-webkit-overflow-scrolling:touch!important}.mobile-menu.open{visibility:visible!important;pointer-events:auto!important;transform:translate3d(0,0,0)!important}.mobile-hamb,.mobile-search-btn{display:grid!important}}`;
  const menuJs=`(function(){function normalizeMenu(){const menus=Array.from(document.querySelectorAll('#mobileMenu'));if(!menus.length)return;const current=menus[menus.length-1];menus.slice(0,-1).forEach(x=>x.remove());if(current.parentElement&&current.parentElement.tagName==='HEADER')document.body.appendChild(current)}window.toggleMenu=function(open){normalizeMenu();const m=document.getElementById('mobileMenu');if(!m)return;const v=!!open;m.classList.toggle('open',v);m.setAttribute('aria-hidden',String(!v));document.body.classList.toggle('menu-open',v)};window.menuGo=function(path){window.toggleMenu(false);go(path)};window.menuDoSearch=function(){const v=document.getElementById('menuSearch')?.value.trim();if(!v)return;window.toggleMenu(false);searchFor(v)};document.addEventListener('DOMContentLoaded',function(){normalizeMenu();const app=document.getElementById('app');if(app)new MutationObserver(normalizeMenu).observe(app,{childList:true})});})();`;
  h=h.replace('</head>','<style>'+menuCss+'</style></head>');
  h=h.replace('</body>','<script>'+menuJs+'<'+'/script></body>');
  document.open();document.write(h);document.close();
 }catch(e){document.getElementById('s').textContent='Não foi possível carregar a prévia. '+e.message}
})();
</script>
</body>
</html>
