<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ediouro — Preview completa</title><style>
:root{--p:#f4efe6;--i:#18211e;--g:#15372d;--l:#cfc4b3;--s:#65706b}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:14px Arial}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}h1,h2,h3,.serif{font-family:Georgia}.w{width:min(1120px,calc(100% - 30px));margin:auto}header{position:sticky;top:0;z-index:9;background:#f4efe6f2;border-bottom:1px solid #0001;backdrop-filter:blur(12px)}.hd{height:64px;display:flex;align-items:center;justify-content:space-between}.logo{font:700 27px Georgia}nav{display:flex;gap:22px}button{font:inherit}.hero{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;min-height:610px;padding:55px 0}.ey{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--s)}h1{font-size:clamp(50px,7vw,90px);line-height:.9;letter-spacing:-.05em;margin:12px 0 20px;font-weight:500}.lead{font-size:17px;line-height:1.55;color:var(--s)}.search{display:flex;border:1px solid #b9ad9c;background:white;margin-top:25px}.search input{flex:1;border:0;outline:0;padding:15px;min-width:0}.search button,.btn{border:0;background:var(--g);color:white;padding:15px 18px}.art{height:430px;position:relative}.art img{position:absolute;width:38%;box-shadow:0 15px 30px #0004}.art img:nth-child(1){left:0;top:90px;transform:rotate(-6deg)}.art img:nth-child(2){left:31%;top:20px;z-index:2}.art img:nth-child(3){right:0;top:125px;transform:rotate(7deg)}section{padding:60px 0}.alt{background:#e9e0d3}.sh{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:25px}.sh h2{font-size:clamp(36px,4.5vw,58px);line-height:.96;margin:5px 0;font-weight:500;letter-spacing:-.03em}.sh p{color:var(--s);max-width:500px}.cats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.cat{min-height:220px;padding:20px;position:relative;overflow:hidden;cursor:pointer}.cat h3{font-size:36px;line-height:.95;margin:0;max-width:7ch;font-weight:500}.cat img{position:absolute;right:-6px;bottom:-30px;width:40%;transform:rotate(7deg);box-shadow:0 8px 20px #0004}.c1{background:#d7c399}.c2{background:#592538;color:white}.c3{background:#25483d;color:white}.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.book{cursor:pointer}.book img{width:100%;aspect-ratio:2/3;object-fit:cover;box-shadow:0 8px 20px #0003}.book h3{font-size:17px;line-height:1.05;margin:9px 0 5px;font-weight:500}.by{font-size:11px;color:var(--s)}.feature{background:var(--g);color:white}.fg{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.feature h2{font-size:62px;line-height:.92;margin:8px 0 18px;font-weight:500;max-width:8ch}.feature p{color:#d7e0dc;line-height:1.6}.fbooks{display:flex;align-items:center;gap:10px}.fbooks img{width:32%;box-shadow:0 12px 28px #0007}.brands{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.brand{min-height:180px;padding:18px;color:white;background:#24483d;display:flex;align-items:end;font:500 23px Georgia;cursor:pointer}.brand:nth-child(2){background:#5b2638}.brand:nth-child(3){background:#7a6133}.brand:nth-child(4){background:#45516a}.brand:nth-child(5){background:#17506a}.brand:nth-child(6){background:#655d4b}.brand:nth-child(7){background:#543056}.pan{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.panel{min-height:330px;border:1px solid var(--l);padding:22px;position:relative}.panel.dark{background:#20332c;color:white}.panel.wine{background:#5a2638;color:white}.panel h3{font-size:34px;line-height:1;margin:8px 0;font-weight:500}.mini{display:flex;gap:8px;position:absolute;bottom:20px;left:20px;right:20px;height:150px}.mini img{height:100%;max-width:45%;object-fit:cover}.disc{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.story{border-top:1px solid;min-height:280px;padding-top:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.story h3{font-size:44px;line-height:.97;margin:10px 0;font-weight:500}.history{background:#ddd0be}.hist{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px}.year{font:500 clamp(100px,16vw,200px)/.8 Georgia;color:#c2ae90}.hist h2,.news h2{font-size:54px;line-height:.95;margin:10px 0;font-weight:500}.news{background:var(--g);color:white}.ng{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:end}footer{background:#0f231d;color:#dbe2df;padding:40px 0}.foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:25px}footer a{display:block;margin:8px 0;color:#aeb9b4}.page{padding:50px 0}.page h1{font-size:64px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 16px}.detail{display:grid;grid-template-columns:320px 1fr;gap:45px}.detail h1{font-size:58px}.ret a{display:inline-block;border:1px solid;padding:10px;margin:8px 5px 0 0}
@media(max-width:780px){nav{display:none}.hero,.fg,.hist,.ng,.detail{grid-template-columns:1fr}.hero{min-height:0;padding:35px 0}h1{font-size:54px}.art{height:290px}section{padding:48px 0}.sh{display:block}.cats{grid-template-columns:1fr 1fr}.cat:first-child{grid-column:span 2}.shelf{display:flex;overflow-x:auto}.shelf .book{min-width:43vw}.feature h2{font-size:50px}.brands{display:flex;overflow-x:auto}.brand{min-width:65vw}.pan,.disc{grid-template-columns:1fr}.hist h2,.news h2{font-size:45px}.foot{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><script>
const B=[{"slug":"o-caminho-dos-reis","title":"O Caminho dos Reis","author":"Brandon Sanderson","imprint":"trama","cat":"fantasia","series":"arquivo-das-tempestades","desc":"Do autor best-seller n.º 1 do “New York Times” Brandon Sanderson, “O caminho dos reis”, o livro mais aguardado de todos os tempos, chega ao Brasil iniciando uma incrível saga épica. Primeiro livro da saga \"Os Relatos da Guerra das Tempestades\"","cover":"https://cdn.awsli.com.br/2444/2444709/produto/169742790/9d80a091b8.jpg","price":199.9,"isbn":"9786589132684","status":"em-catalogo"},{"slug":"os-assassinatos-no-honjin","title":"Os assassinatos no Honjin","author":"Seishi Yokomizo","imprint":"trama","cat":"crime-e-misterio","series":"","desc":"No inverno de 1937, um misterioso assassinato abala a vila de Okamura na noite de um casamento. Com uma espada de samurai ensanguentada como única pista, o detetive Kosuke Kindaichi precisa desvendar um crime aparentemente impossível","cover":"https://cdn.awsli.com.br/2444/2444709/produto/403115194/c54d28b1634647aaa4a971f16a44790e-45ebyi6cfq.png","price":69.9,"isbn":"9786581339616","status":"em-catalogo"},{"slug":"eu-te-amei-em-outra-vida","title":"Eu te amei em outra vida","author":"David Arnold","imprint":"livros-da-alice","cat":"romance","series":"","desc":"Uma sensível história de amor sobre dois jovens sensíveis e suas almas que insistem em se encontrar a cada nova vida.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/251633405/eu-te-amei-em-outra-vida_capa-e-quarta-capa_fundo-rdw9f32wd5.jpg","price":54.9,"isbn":"9786585659048","status":"em-catalogo"},{"slug":"a-fome-dos-deuses","title":"A Fome dos Deuses","author":"John Gwynne","imprint":"trama","cat":"fantasia","series":"bloodsworn","desc":"Segundo volume da Saga Bloodsworn, de John Gwynne.","cover":"","price":139.9,"isbn":"9786581339623","status":"lancamento-futuro"},{"slug":"a-ascensao-do-zodiaco","title":"A ascensão do zodíaco","author":"Katie Zhao","imprint":"livros-da-alice","cat":"fantasia","series":"","desc":"Na prestigiada Academia dos Ramos Terrenos, os herdeiros das linhagens do zodíaco chinês são treinados para dominar habilidades extraordinárias. Um lugar fascinante e sombrio, onde poder e conhecimento caminham lado a lado com segredos e perigos","cover":"https://cdn.awsli.com.br/2444/2444709/produto/400586163/acc78367f5564f019826cc2be7932d1b-n5de2iqe4y.jpg","price":79.9,"isbn":"9786585659451","status":"em-catalogo"},{"slug":"a-sombra-dos-deuses","title":"A sombra dos deuses","author":"John Gwynne","imprint":"trama","cat":"fantasia","series":"bloodsworn","desc":"⚔️ A sombra dos deuses, de John Gwynne, abre a Saga Bloodsworn: uma fantasia épica inspirada na mitologia nórdica, com batalhas brutais, personagens marcantes e um mundo onde até ossos divinos guardam poder e perigo.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/372477285/mockup_a-sombra-dos-deuses_capa-frente-1azg57cmfm.png","price":99.9,"isbn":"9786581339333","status":"em-catalogo"},{"slug":"mistborn-o-imperio-final","title":"Mistborn: O império final","author":"Brandon Sanderson","imprint":"trama","cat":"fantasia","series":"mistborn","desc":"AS BRUMAS DOMINAM A NOITE. O SENHOR SOBERANO DOMINA O MUNDO. Certa vez, um herói surgiu para salvar o mundo. Ele fracassou. Desde então, o mundo tem sido um deserto de cinzas e névoa, governado pelo imortal","cover":"https://cdn.awsli.com.br/2444/2444709/produto/349632993/mockup_mistborn_capa-frente-8hdeaoza1v.png","price":104.9,"isbn":"9786581339180","status":"em-catalogo"},{"slug":"warbreaker-o-sopro-dos-deuses","title":"Warbreaker: o sopro dos Deuses","author":"Brandon Sanderson","imprint":"trama","cat":"fantasia","series":"","desc":"Este é um livro independente (standalone) situado no universo interconectado do Cosmere, criado pelo autor. Alguns dos personagens dessa obra acabam desempenhando papéis importantes na série Os Relatos da Guerra das Tempestades.","cover":"https://cdn.awsli.com.br/2444/2444709/produto/310018573/warbreaker_capa-8tihmcawes.png","price":169.9,"isbn":"9786581339067","status":"em-catalogo"}],M=Object.fromEntries(B.map(b=>[b.slug,b])),money=v=>v==null?'':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),go=p=>location.hash=p,path=()=>location.hash.slice(1)||'/';
const H=['o-caminho-dos-reis','os-assassinatos-no-honjin','eu-te-amei-em-outra-vida'],P=['a-fome-dos-deuses','a-ascensao-do-zodiaco','os-assassinatos-no-honjin','eu-te-amei-em-outra-vida','a-sombra-dos-deuses'];
function hd(){return `<header><div class="w hd"><div class="logo" onclick="go('/')">ediouro.</div><nav><a href="#/livros">Livros</a><a href="#/autores">Autores</a><a href="#/series">Séries</a><a href="#/marcas">Marcas</a><a href="#/descubra">Descubra</a></nav><button onclick="go('/livros')">Buscar</button></div></header>`}function ft(){return `<footer><div class="w foot"><div><div class="logo">ediouro.</div><p style="color:#9eaaa4">Livros, autores, séries e marcas em um só lugar.</p></div><div><b>Descubra</b><a href="#/livros">Livros</a><a href="#/autores">Autores</a><a href="#/series">Séries</a></div><div><b>Marcas</b><a href="#/marca/trama">Trama</a><a href="#/marca/livros-da-alice">Livros da Alice</a><a href="#/marcas">Todas</a></div><div><b>Ediouro</b><a href="#/sobre">Sobre</a><a href="#/sobre">História</a><a href="#/sobre">Carreiras</a></div></div></footer>`}function bc(b){if(!b)return'';return `<div class="book" onclick="go('/livro/${b.slug}')">${b.cover?`<img src="${b.cover}">`:`<div style="aspect-ratio:2/3;background:#d8d0c3;display:grid;place-items:center;padding:12px;font-family:Georgia">${b.title}</div>`}<h3>${b.title}</h3><div class="by">${b.author} · ${b.imprint==='trama'?'TRAMA':'LIVROS DA ALICE'}</div></div>`}function shelf(a){return `<div class="shelf">${a.map(s=>typeof s==='string'?M[s]:s).filter(Boolean).map(bc).join('')}</div>`}
function home(){return `${hd()}<main><div class="w hero"><div><div class="ey">Encontre sua próxima leitura</div><h1>Todo mundo tem um livro esperando.</h1><p class="lead">Histórias, autores e universos publicados pelas marcas do Grupo Ediouro.</p><div class="search"><input id="q" placeholder="Título, autor, série ou ISBN"><button onclick="search()">Buscar</button></div><p style="color:#7c857f;font-size:11px">Desde 1939 · catálogo real em integração</p></div><div class="art">${H.map(s=>`<img src="${M[s].cover}" onclick="go('/livro/${s}')">`).join('')}</div></div>
<section><div class="w"><div class="sh"><div><div class="ey">Descoberta</div><h2>O que você quer ler?</h2></div><p>Categorias já alimentadas pelo catálogo real.</p></div><div class="cats"><div class="cat c1" onclick="go('/livros?c=fantasia')"><div class="ey">Fantasia</div><h3>Outros mundos esperam.</h3><img src="${M['o-caminho-dos-reis'].cover}"></div><div class="cat c2" onclick="go('/livros?c=crime-e-misterio')"><div class="ey">Crime e mistério</div><h3>Monte o quebra-cabeça.</h3><img src="${M['os-assassinatos-no-honjin'].cover}"></div><div class="cat c3" onclick="go('/livros?c=romance')"><div class="ey">Romance</div><h3>Histórias para sentir.</h3><img src="${M['eu-te-amei-em-outra-vida'].cover}"></div></div></div></section>
<section><div class="w"><div class="sh"><div><div class="ey">Catálogo</div><h2>Acabaram de chegar</h2></div><a href="#/livros">Ver todos →</a></div>${shelf(P)}</div></section>
<section class="feature"><div class="w fg"><div><div class="ey" style="color:#c0b3cf">Comece por aqui</div><h2>Quer entrar no Cosmere?</h2><p>Mistborn, Warbreaker e O Arquivo das Tempestades. O catálogo também vira guia de leitura.</p><a class="btn" href="#/autor/brandon-sanderson">Descubra o Cosmere →</a></div><div class="fbooks">${['mistborn-o-imperio-final','warbreaker-o-sopro-dos-deuses','o-caminho-dos-reis'].map(s=>`<img src="${M[s].cover}">`).join('')}</div></div></section>
<section><div class="w"><div class="sh"><div><div class="ey">Curadoria</div><h2>Escolha por onde começar</h2></div><p>Fantasia, crime, romance e outras estantes editoriais.</p></div>${shelf(['o-caminho-dos-reis','a-sombra-dos-deuses','a-ascensao-do-zodiaco','mistborn-o-imperio-final','warbreaker-o-sopro-dos-deuses','os-assassinatos-no-honjin'])}</div></section>
<section class="alt"><div class="w"><div class="sh"><div><div class="ey">Nossas casas editoriais</div><h2>Muitas vozes.<br>Muitos leitores.<br>Uma Ediouro.</h2></div><p>Cada marca com personalidade própria dentro do mesmo sistema.</p></div><div class="brands">${[['Nova Fronteira','nova-fronteira'],['Trama','trama'],['Agir','agir'],['Petra','petra'],['Coquetel','coquetel'],['Pixel','pixel'],['Livros da Alice','livros-da-alice']].map(x=>`<div class="brand" onclick="go('/marca/${x[1]}')">${x[0]}</div>`).join('')}</div></div></section>
<section><div class="w pan"><div class="panel"><div class="ey">Vem aí</div><h3>Próximas histórias</h3><p>Pré-vendas e lançamentos futuros.</p><div class="mini">${['a-fome-dos-deuses'].map(s=>bc(M[s])).join('')}</div></div><div class="panel dark"><div class="ey" style="color:#c1cdc7">Série em destaque</div><h3>O Arquivo das Tempestades</h3><p>Conheça Roshar e a ordem de leitura.</p><a href="#/serie/arquivo-das-tempestades">Ver série →</a></div><div class="panel wine"><div class="ey" style="color:#decbd1">Autores</div><h3>Quem escreve nossas histórias</h3><p>Brandon Sanderson<br>John Gwynne<br>Seishi Yokomizo<br>David Arnold</p><a href="#/autores">Ver autores →</a></div></div></section>
<section class="alt"><div class="w"><div class="sh"><div><div class="ey">Descubra</div><h2>Um livro leva a outro.</h2></div></div><div class="disc"><div class="story" onclick="go('/autor/brandon-sanderson')"><div><div class="ey">Guia de leitura</div><h3>Por onde começar a ler Brandon Sanderson?</h3></div><span>Entrar no Cosmere →</span></div><div class="story" onclick="go('/livros?c=crime-e-misterio')"><div><div class="ey">Curadoria</div><h3>Crime e mistério para montar o quebra-cabeça.</h3></div><span>Descobrir →</span></div></div></div></section>
<section class="history"><div class="w hist"><div class="year">1939</div><div><div class="ey">Grupo Ediouro</div><h2>Há mais de oito décadas, ajudamos histórias a encontrar leitores.</h2><p>O institucional vem depois do catálogo, da descoberta e das marcas.</p><a href="#/sobre">Conheça nossa história →</a></div></div></section>
<section class="news"><div class="w ng"><div><div class="ey" style="color:#b9c5c0">Continue por perto</div><h2>Quer um livro novo na sua vida?</h2><p>Receba lançamentos, recomendações e novidades.</p></div><div class="search"><input placeholder="seu@email.com"><button onclick="alert('Integração com RD/HubSpot entra depois.')">Quero receber</button></div></div></section></main>${ft()}`}
function search(){let q=(document.getElementById('q')?.value||'').toLowerCase(),b=B.find(x=>(x.title+' '+x.author+' '+x.isbn).toLowerCase().includes(q));b?go('/livro/'+b.slug):go('/livros')}
function catalog(q=''){let c=new URLSearchParams(q).get('c')||'',a=B.filter(b=>!c||b.cat===c);return `${hd()}<main class="w page"><div class="ey">Catálogo</div><h1>Livros</h1><div class="grid">${a.map(bc).join('')}</div></main>${ft()}`}
function book(s){let b=M[s];return b?`${hd()}<main class="w page detail"><div>${b.cover?`<img src="${b.cover}">`:''}</div><div><div class="ey">${b.imprint==='trama'?'Trama':'Livros da Alice'}</div><h1>${b.title}</h1><h3>${b.author}</h3><p class="lead">${b.desc}</p><div style="font-size:22px;font-weight:700">${money(b.price)}</div><h4>Onde comprar</h4><div class="ret"><a target="_blank" href="https://www.amazon.com.br/s?k=${encodeURIComponent(b.isbn||b.title)}">Amazon</a><a target="_blank" href="https://lista.mercadolivre.com.br/${encodeURIComponent(b.isbn||b.title)}">Mercado Livre</a><a target="_blank" href="https://www.travessa.com.br/Busca.aspx?d=1&Ntt=${encodeURIComponent(b.isbn||b.title)}">Travessa</a></div></div></main>${ft()}`:nf()}
function simple(title,body=''){return `${hd()}<main class="w page"><h1>${title}</h1><p class="lead">${body}</p>${shelf(B.map(x=>x.slug).slice(0,6))}</main>${ft()}`}function nf(){return simple('Esta página ainda não foi encontrada.','Volte ao início e escolha outra rota.')}
function render(){let r=path(),[p,q='']=r.split('?'),x=p.split('/').filter(Boolean);document.getElementById('app').innerHTML=p==='/'?home():x[0]==='livros'?catalog(q):x[0]==='livro'?book(x[1]):x[0]==='autores'?simple('Autores','Páginas de autor já fazem parte da arquitetura.'):x[0]==='autor'?simple('Autor','Livros deste autor nesta primeira carga.'):x[0]==='series'?simple('Séries e universos','Ordens de leitura e sagas do catálogo.'):x[0]==='serie'?simple('O Arquivo das Tempestades','Ordem de leitura em construção com a base editorial.'):x[0]==='marcas'?simple('Nossas marcas','As casas editoriais do Grupo Ediouro.'):x[0]==='marca'?simple(x[1]?.replaceAll('-',' ')||'Marca','Catálogo desta marca em integração.'):x[0]==='descubra'?simple('Descubra','Guias, curadorias e caminhos de leitura.'):x[0]==='sobre'?simple('Grupo Ediouro','História, imprensa, carreiras e negócios.'):nf();scrollTo(0,0)}addEventListener('hashchange',render);render();
</script></body></html>
