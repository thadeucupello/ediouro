name: RGE cover download test

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rge-cover-download-test.yml"

jobs:
  test-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Download one RGE cover through São Paulo proxy
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
            "https://wubthvvtncflzkblgtzh.supabase.co/functions/v1/rge-cover-test?key=rge-cover-test-20260918-f72b1c9e" \
            -o out/9786589132912.jpg
          test -s out/9786589132912.jpg
          file out/9786589132912.jpg
          ls -lh out/9786589132912.jpg
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: rge-cover-test
          path: out/9786589132912.jpg
          if-no-files-found: error
