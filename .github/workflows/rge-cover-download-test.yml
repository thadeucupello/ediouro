name: RGE cover download test

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rge-cover-download-test.yml"

jobs:
  test-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Download one RGE cover
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 2 --connect-timeout 10 --max-time 60 \
            -H "Referer: https://ediouro-preview.vercel.app/" \
            -H "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8" \
            -H "User-Agent: Mozilla/5.0" \
            "https://simpleset.ediouro.com.br/imagens/capas/PRD//6044ece240884f11ab8c566fab9e0036.jpg" \
            -o out/9786589132912.jpg
          test -s out/9786589132912.jpg
          file out/9786589132912.jpg
          ls -lh out/9786589132912.jpg
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: rge-cover-test
          path: out/9786589132912.jpg
          if-no-files-found: error
